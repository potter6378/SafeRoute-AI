# httpd-saferoute.conf (Apache 설정 예시)
#
# 역할: HTTPD(웨이터)가 80번 포트로 들어온 요청 중 /api/로 시작하는 건
#      전부 daemon.py(주방, 5000번 포트)에게 넘겨준다.
#
# 필요 모듈 활성화 (라즈베리파이 Apache 기준):
#   sudo a2enmod proxy proxy_http
#   sudo systemctl restart apache2
#
# 이 파일을 /etc/apache2/sites-available/saferoute.conf 로 저장 후:
#   sudo a2ensite saferoute
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName saferoute.local

    ProxyPreserveHost On

    # /api/detect 로 오는 요청을 daemon.py의 /detect 로 그대로 전달
    ProxyPass /api/detect http://127.0.0.1:5000/detect
    ProxyPassReverse /api/detect http://127.0.0.1:5000/detect

    ProxyPass /api/health http://127.0.0.1:5000/health
    ProxyPassReverse /api/health http://127.0.0.1:5000/health

    # 대시보드(민주님 화면)는 별도 정적 파일 경로로 서빙한다고 가정
    DocumentRoot /var/www/saferoute-dashboard

    ErrorLog ${APACHE_LOG_DIR}/saferoute_error.log
    CustomLog ${APACHE_LOG_DIR}/saferoute_access.log combined
</VirtualHost>
